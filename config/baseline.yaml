hydra:
  run:
    dir: outputs/${now:%Y%m%d%H%M%S}

logger:
  log_level: INFO

environment:
  device: cpu
  robot: MH5Robot-v8
  fps: 50
  orientation: front
  kwargs:
    healthy_z_range: [0.16, 0.25]
    max_episode_steps: 2000


model:
  policy_net_spec: [256, 256, 256]
  value_net_spec: [256, 256, 256]
  gae_gamma: 0.99
  gae_lambda: 0.95

collector:
  frames_per_batch: 2000
  total_frames: 10000000

ClipPPOLoss:
  clip_epsilon:  0.2
  entropy_eps: 1e-4
  critic_coeff: 1.0
  loss_critic_type: smooth_l1
  max_grad_norm: 1.0

optim:
  lr: 1e-5

scheduler:
  eta_min: 0.0

training_loop:
  num_epochs: 10
  sub_batch_size: 128
  validate_every_number_of_batches: 50

continue_session:
  from_checkpoint: null
  restart_lr: true
