summary: |
  # Task: Walking - uncontrolled

  Learning for uncontrolled walking (no joystick).

  Important differences from other runs:
  * policy and actor net specs [1024, 256, 256] to account better for increased number of observation due to stacking
  * learning rate: 1e-5 (attempting to see if the `nan` was fixed by changes to the env handling of z_position)
  * `forward_reward_weight`: 5.0 to encourage more exploration in the move forward
  * `sub-sub_batch_size`: 128 (increase the training speed)
  * `num_epochs`: 8 (increase the training speed)

  Keep an eye:
  * the policy might learn to keep the robot frozen upright to accumulate live reward and ignore moving forward; might need to increase the reward for forward moving to compensate for this

hydra:
  run:
    dir: outputs/${now:%Y%m%d%H%M%S}

logger:
  log_level: INFO

environment:
  device: cpu
  robot: MH5Robot-v8
  fps: 100 # VideoRecorder uses a skip frame of 2 by default
  orientation: standing
  kwargs:
    max_episode_steps: 2000
    rew_config:
      healthy_z_range: [0.15, 0.25]
      forward_reward_weight: 5.0
      ctrl_cost_weight: 0.1
      contact_cost_weight:  5e-7
      contact_cost_range:  [-.inf, 10.0]
      healthy_reward: 5.0
      terminate_when_unhealthy: True
    obs_config:
      number_obs_stack: 5
      exclude_current_positions_from_observation: True
      include_cinert_in_observation:  False
      include_cvel_in_observation:  False
      include_qfrc_actuator_in_observation: False
      include_cfrc_ext_in_observation: False


model:
  policy_net_spec: [1024, 256, 256]
  value_net_spec: [1024, 256, 256]
  gae_gamma: 0.99
  gae_lambda: 0.95

collector:
  frames_per_batch: 2000
  total_frames: 10000000

ClipPPOLoss:
  clip_epsilon:  0.2
  entropy_eps: 1e-4
  critic_coeff: 1.0
  loss_critic_type: smooth_l1
  max_grad_norm: 1.0

optim:
  lr: 1e-5

scheduler:
  eta_min: 0.0

training_loop:
  num_epochs: 8
  sub_batch_size: 128
  validate_every_number_of_batches: 50

continue_session:
  from_checkpoint: null
  restart_lr: true
