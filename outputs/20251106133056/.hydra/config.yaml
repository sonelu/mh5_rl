summary: '# Task: Walking - uncontrolled


  Learning for uncontrolled walking (no joystick).


  Important differences from other runs:

  * learning rate: 1e-4; (lr of 1e-3, 5e-4, 2.5e-4 are unstable and results in nans)


  Keep an eye:

  * the policy might learn to keep the robot frozen upright to accumulate live reward
  and ignore moving forward; might need to increase the reward for forward moving
  to compensate for this

  '
logger:
  log_level: INFO
environment:
  device: cpu
  robot: MH5Robot-v8
  fps: 100
  orientation: standing
  kwargs:
    max_episode_steps: 2000
    rew_config:
      healthy_z_range:
      - 0.15
      - 0.25
      forward_reward_weight: 1.25
      ctrl_cost_weight: 0.1
      contact_cost_weight: 5.0e-07
      contact_cost_range:
      - -.inf
      - 10.0
      healthy_reward: 5.0
      terminate_when_unhealthy: true
    obs_config:
      number_obs_stack: 5
      exclude_current_positions_from_observation: true
      include_cinert_in_observation: false
      include_cvel_in_observation: false
      include_qfrc_actuator_in_observation: false
      include_cfrc_ext_in_observation: false
model:
  policy_net_spec:
  - 512
  - 256
  - 256
  value_net_spec:
  - 512
  - 256
  - 256
  gae_gamma: 0.99
  gae_lambda: 0.95
collector:
  frames_per_batch: 2000
  total_frames: 10000000
ClipPPOLoss:
  clip_epsilon: 0.2
  entropy_eps: 0.0001
  critic_coeff: 1.0
  loss_critic_type: smooth_l1
  max_grad_norm: 1.0
optim:
  lr: 0.0001
scheduler:
  eta_min: 0.0
training_loop:
  num_epochs: 10
  sub_batch_size: 128
  validate_every_number_of_batches: 50
continue_session:
  from_checkpoint: null
  restart_lr: true
